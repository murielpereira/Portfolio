<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="rastreamento.css">
    <script src="rastreamento.js"></script>
    <title>Rastreio Interno SmartEnvios</title>
</head>
<body>

    <div id="menu-placeholder"></div>

    <div id="toast">Código copiado com sucesso!</div>

    <form class="campo_pesquisar" onsubmit="event.preventDefault(); pesquisar();">
        <input type="text" id="codigo" placeholder="Digite o código (Ex: SM...)" value="" aria-label="Código de rastreamento">
        <input type="submit" id="botao_pesquisar" value="RASTREAR">
    </form>

    <div id="resultado"></div>

</body>
</html>
